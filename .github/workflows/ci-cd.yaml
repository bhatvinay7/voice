name: CI/CD & GitOps Automation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - worker
          - scheduler
          - web

permissions:
  contents: read

concurrency:
  group: estate-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPO: bhatvinay7/voice-k8s

jobs:
  validate-rust:
    name: Validate Rust Workspace
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libglib2.0-dev

      - uses: Swatinem/rust-cache@v2

      # Style findings are reported but do not block the pipeline yet.
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Lint
        continue-on-error: true
        run: cargo clippy --workspace -- -D warnings

      - name: Build check
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --workspace --all-targets

  validate-web:
    name: Validate Web App
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check-types

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-22.04
    outputs:
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter diffs HEAD against HEAD~1 on push events.
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - '.github/workflows/**'
              - '.dockerignore'
            backend:
              - 'crates/services/server/**'
              - 'crates/libs/orchestrator/**'
              - 'crates/services/scheduler/**'
              - 'crates/libs/agent/**'
              - 'crates/libs/config/**'
              - 'crates/libs/db/**'
              - 'crates/libs/pubsub/**'
              - 'crates/libs/rag/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            worker:
              - 'crates/services/worker/**'
              - 'crates/libs/config/**'
              - 'crates/libs/db/**'
              - 'crates/libs/pubsub/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            scheduler:
              - 'crates/services/scheduler/**'
              - 'crates/libs/**'
              - 'proto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'apps/web/**'

      - name: Resolve services to build
        id: resolve
        shell: bash
        run: |
          ALL_SERVICES='["backend","worker","scheduler","web"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.service }}" = "all" ]; then
              echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            else
              json=$(printf '%s\n' "${{ inputs.service }}" | jq -R . | jq -s -c .)
              echo "services=$json" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            echo "services=$ALL_SERVICES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          services=()
          if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then services+=("backend"); fi
          if [ "${{ steps.filter.outputs.worker }}" = "true" ]; then services+=("worker"); fi
          if [ "${{ steps.filter.outputs.scheduler }}" = "true" ]; then services+=("scheduler"); fi
          if [ "${{ steps.filter.outputs.web }}" = "true" ]; then services+=("web"); fi

          if [ ${#services[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s -c .)
            echo "services=$json" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: [validate-rust, validate-web, detect-changes]
    # Pull requests only validate; images are pushed from dev and main.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/voice-${{ matrix.service }}
          tags: |
            type=sha,prefix=commit-
            type=raw,value=${{ github.ref_name }}-latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service == 'backend' && 'crates/services/server/Dockerfile' || matrix.service == 'worker' && 'crates/services/worker/Dockerfile' || matrix.service == 'scheduler' && 'crates/services/scheduler/Dockerfile' || 'apps/web/Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_LIVEKIT_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}

  update-gitops-tags:
    name: Update ArgoCD GitOps Manifests
    needs: [build-and-push, detect-changes]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Validate GitOps credentials
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "Error: GITOPS_TOKEN is not configured in the production environment."
            exit 1
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: main
          # PAT with contents:write on the GitOps repository.
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - uses: imranismail/setup-kustomize@v2

      - name: Update image tags for changed services
        working-directory: gitops-repo/apps
        run: |
          TAG="commit-$(echo '${{ github.sha }}' | cut -c1-7)"
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')

          for svc in $(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]'); do
            echo "Updating voice-${svc} to ${TAG}"
            kustomize edit set image "voice-${svc}=${{ env.REGISTRY }}/${OWNER}/voice-${svc}:${TAG}"
          done

      - name: Commit and push GitOps tag updates
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          kustomize build apps > /dev/null
          git add apps/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi
          git commit -m "chore(gitops): update image tags to commit-$(echo '${{ github.sha }}' | cut -c1-7) [skip ci]"
          git push origin HEAD:main
