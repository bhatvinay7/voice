services:
  control-plane:
    image: ${REGISTRY:-docker.io/myrepo}/real-estate-control-plane:${TAG:-latest}
    build:
      context: .
      dockerfile: crates/services/control-plane/Dockerfile
    ports:
      - "50051:50051"
      - "9090:9090"
    env_file:
      - crates/services/control-plane/.env
    restart: unless-stopped

  worker:
    image: ${REGISTRY:-docker.io/myrepo}/real-estate-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: crates/services/worker/Dockerfile
    env_file:
      - crates/services/worker/.env
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-docker.io/myrepo}/real-estate-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: crates/services/server/Dockerfile
      args:
        DEEPFILTERNET_VERSION: ${DEEPFILTERNET_VERSION:-0.5.6}
    ports:
      - "4000:4000"
    env_file:
      - crates/services/server/.env
    environment:
      - CONTROL_PLANE_ENDPOINT=http://control-plane:50051
    depends_on:
      - control-plane
    restart: unless-stopped

  web:
    image: ${REGISTRY:-docker.io/myrepo}/real-estate-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${LIVEKIT_URL:-wss://estate-12gbyba5.livekit.cloud}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
    restart: unless-stopped
