syntax = "proto3";

package scheduler;

service CellControl {
    rpc Start(StartSession) returns (AdmissionResult);
    rpc Stop(StopSession) returns (AdmissionResult);
    // One long-lived bidirectional stream per cell/scheduler pair.
    rpc ConnectStream(stream CellMessage) returns (stream SchedulerMessage);
}

// Messages sent from the Cell to the Scheduler
message CellMessage {
    oneof msg {
        RegisterCell register = 1;
        SlotUpdate slot_update = 2;
        SessionStarted session_started = 3;
        SessionEnded session_ended = 4;
        Heartbeat heartbeat = 5;
        AdmissionResult admission_result = 6;
    }
}

// Messages sent from the Scheduler to the Cell
message SchedulerMessage {
    oneof msg {
        StartSession start_session = 1;
        CancelSession cancel_session = 2;
        StopSession stop_session = 3;
        Drain drain = 4;
        Ping ping = 5;
    }
}

message RegisterCell {
    string cell_id = 1;
    uint32 capacity = 2;
    uint32 active_sessions = 3;
    uint32 free_slots = 4;
    string status = 5;
}

message SlotUpdate {
    uint32 free_slots = 1;
    uint64 sequence_number = 2;
}

message SessionStarted {
    string session_id = 1;
    string cell_id = 2;
}

message SessionEnded {
    string session_id = 1;
    string cell_id = 2;
}

message Heartbeat {
    string cell_id = 1;
    uint32 capacity = 2;
    uint32 active_sessions = 3;
    uint32 free_slots = 4;
    string status = 5;
}

message StartSession {
    string session_id = 1;
    string user_id = 2;
    string language = 3;
    uint64 request_id = 4;
}

message CancelSession {
    string session_id = 1;
}

message StopSession {
    string session_id = 1;
}

message Drain {}

message Ping {}

// A rejected request is safe to retry elsewhere with a new routed session ID.
// A deadline is ambiguous: retry the SAME session ID; never allocate a second call.
message AdmissionResult {
    string session_id = 1;
    bool accepted = 2;
    string reason = 3;
    uint64 request_id = 4;
}
